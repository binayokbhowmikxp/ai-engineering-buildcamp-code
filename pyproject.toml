[project]
name = "ai-engineering-buildcamp-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gitsource>=0.0.5",
    "jupyter>=1.1.1",
    "markdown[pdf]>=3.11",
    "markitdown[pdf]>=0.1.8",
    "minsearch>=0.2.0",
    "openai>=3.16.2",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "toyaikit>=0.0.11",
]

[project.scripts]
ai-engineering-buildcamp-code = "ai_engineering_buildcamp_code:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
